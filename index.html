<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#c92732">
  <meta name="description" content="نظام عربي لإدارة مشتريات الصيدلية، استيراد الفواتير، متابعة النواقص ومقارنة الأسعار بعد البونص.">
  <title>نظام إدارة الصيدلية</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">+</span><div><strong>إدارة الصيدلية</strong><small>نظام المشتريات والمخزون</small></div></div>
      <nav id="navigation">
        <button class="nav-link active" data-page="dashboard">▦ <span>لوحة التحكم</span></button>
        <button class="nav-link" data-page="items">▤ <span>قاعدة الأصناف</span></button>
        <button class="nav-link" data-page="invoices">⇧ <span>استيراد الفواتير</span></button>
        <button class="nav-link" data-page="shortages">! <span>إدارة النواقص</span></button>
        <button class="nav-link" data-page="compare">⇄ <span>مقارنة الأسعار</span></button>
        <button class="nav-link" data-page="orders">▣ <span>طلبيات الشراء</span></button>
        <button class="nav-link" data-page="suppliers">♙ <span>الموردون</span></button>
        <button class="nav-link" data-page="history">◷ <span>سجل المشتريات</span></button>
        <button class="nav-link" data-page="backup">⬇ <span>النسخ الاحتياطي</span></button>
      </nav>
      <div class="sidebar-foot">نسخة تطويرية · تخزين محلي على الجهاز</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button
  class="mobile-menu"
  id="mobileMenu"
  aria-label="القائمة"
  type="button"
  onclick="document.getElementById('sidebar').classList.toggle('open')"
>☰</button>
        <div><h1 id="pageTitle">لوحة التحكم</h1><p id="pageSubtitle">ملخص حالة قاعدة البيانات والمشتريات</p></div>
        <div class="top-actions"><span class="storage-state"><i></i> قاعدة البيانات محلية</span></div>
      </header>
      <section id="pageContent" class="content"></section>
      <footer>نظام إدارة الصيدلية — البيانات محفوظة محلياً في هذا المتصفح فقط. صدّر نسخة احتياطية بانتظام.</footer>
    </main>
  </div>
  <dialog id="modal"><form method="dialog" class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" value="cancel">×</button></div><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
